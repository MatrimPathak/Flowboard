workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - google_play_credentials   # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        - firebase_credentials      # GOOGLE_SERVICES_JSON (base64)
        - android_signing           # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_PASSWORD, CM_KEY_ALIAS
      vars:
        PACKAGE_NAME: "com.flowboard.app"
        GOOGLE_PLAY_TRACK: internal

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Set up google-services.json
        script: |
          echo $GOOGLE_SERVICES_JSON | base64 --decode > \
            android/app/google-services.json

      - name: Set up Android keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > android/app/flowboard.keystore
          cat >> android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=flowboard.keystore
          EOF

      - name: Install dependencies
        script: flutter pub get

      - name: Run code generation
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Run analyzer
        script: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        script: flutter test --coverage

      - name: Build release AAB
        script: |
          flutter build appbundle \
            --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/apk/release/*.apk
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK
        submit_as_draft: true
      email:
        recipients:
          - matrimpathak1999@gmail.com

  android-pr-check:
    name: Android PR Check
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - firebase_credentials

    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true

    scripts:
      - name: Set up google-services.json
        script: |
          echo $GOOGLE_SERVICES_JSON | base64 --decode > \
            android/app/google-services.json

      - name: Install dependencies
        script: flutter pub get

      - name: Run code generation
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        script: flutter analyze

      - name: Test
        script: flutter test
