name: flowboard
description: Flowboard — project management for teams
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.3

  # Auth providers
  google_sign_in: ^6.2.1
  flutter_web_auth_2: ^4.0.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Data models
  freezed_annotation: ^2.4.3
  json_annotation: ^4.9.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.3
  table_calendar: ^3.1.2

  # File handling
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  timeago: ^3.7.0
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  collection: ^1.19.0

  # Charts
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

  # Testing
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.2
  firebase_auth_mocks: ^0.14.1

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
